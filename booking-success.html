<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Neith Stays</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f7;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .card {
            width: min(90%, 420px);
            padding: 40px 30px;
            box-sizing: border-box;
            text-align: center;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .check {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 8px 0;
            color: #666;
            line-height: 1.5;
        }

        .amount {
            margin: 24px 0;
            font-size: 24px;
            font-weight: 700;
            color: #222;
        }

        .confirmation {
            margin-top: 24px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="check">✓</div>

        <h1>Payment Successful</h1>

        <p>Thank you for choosing Neith Stays.</p>
        <p>Your payment has been received successfully.</p>

        <div class="amount">£5.00 GBP</div>

        <p>Your Neith Stays booking request has been received.</p>

        <p class="confirmation">
            A confirmation will be provided with your booking details.
        </p>
    </div>
</body>
</html>
