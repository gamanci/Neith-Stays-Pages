<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neith Stays</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f7fa;
        }

        .card {
            text-align: center;
            padding: 40px 48px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            color: #1a365d;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 24px;
        }

        .price {
            font-size: 3rem;
            font-weight: 700;
            color: #2c5282;
            margin-bottom: 28px;
        }

        .payment-label {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 12px;
        }

        #google-pay-button {
            min-height: 48px;
            display: flex;
            justify-content: center;
        }

        #google-pay-button button {
            width: 100% !important;
        }

        #payment-message {
            margin-top: 16px;
            color: #e53e3e;
            font-size: 0.9rem;
        }

        .secure {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #777;
        }
    </style>

    <script
        async
    </script>

    <!-- Our payment code -->
    <script src="./app.js" defer></script>
</head>

<body>

    <div class="card">

        <h1>Neith Stays</h1>

        <p class="subtitle">
            Luxury Accommodation
        </p>

        <div class="price">
            £5.00 GBP
        </div>

        <p class="payment-label">
            Pay securely with SumUp
        </p>

        <div id="google-pay-button"></div>

        <div id="payment-message"></div>

        <p class="secure">
            Secure payment powered by SumUp
        </p>

    </div>

</body>
</html>
